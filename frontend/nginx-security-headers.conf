# ============================================================================
#  Ortak güvenlik başlıkları — /etc/nginx/snippets/security-headers.conf
# ============================================================================
# nginx'te `add_header` MİRAS ALINMAZ: bir location bloğunda tek bir add_header
# tanımlanır tanımlanmaz üst seviyedeki TÜM add_header'lar o blok için düşer.
# Kendi Cache-Control'ünü yazan bloklar (/assets/, /sw.js) bu yüzden güvenlik
# başlıklarını sessizce kaybediyordu. Başlıklar burada tek yerde tutulup
# ihtiyacı olan her bloğa `include` ile geri veriliyor.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Dev kopyası için noindex (bkz. nginx.conf'taki `map $host $robots_tag`). Prod'da
# değişken boş kalır ve nginx başlığı hiç eklemez.
add_header X-Robots-Tag $robots_tag always;

# camera=(self): /app/ altındaki PWA belge tarayıcısı getUserMedia kullanıyor.
# Bu başlık yalnızca origin'e HAKKI tanır — tarayıcı kullanıcıya izni yine ayrıca
# sorar. camera=() ile kamera, izin verilse bile tamamen bloke oluyordu.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

# CSP notları:
#  - img-src/frame-src/media-src blob: — evrak önizlemeleri authenticated fetch +
#    URL.createObjectURL ile çekilip <img>/<iframe> src'ine yazılıyor (bkz.
#    DocumentViewModal, DigitizeQueue); 'self' blob: URL'lerini KAPSAMAZ.
#  - script-src'de eval/wasm İZNİ YOK ve olmamalı. Belge tarayıcısı için OpenCV.js
#    değerlendirildi ancak Embind katmanı başlatmada `new Function()` çağırıyor, yani
#    site geneli 'unsafe-eval' gerektiriyordu; kenar tespiti bunun yerine saf
#    TypeScript ile yazıldı (bkz. src/app/scanner/detectDocument.ts).
#  - form-action'da shopier.com var: ödeme sayfasına imzalı alanlarla form POST'u
#    yapılıyor (bkz. backend shopier.provider.ts). 'self' ile sınırlı kalsaydı tarayıcı
#    gönderimi SESSİZCE engelliyordu. Yalnızca form gönderimi izinli; script/connect
#    kaynakları hâlâ kendi origin'imizle sınırlı.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://www.shopier.com; object-src 'none'" always;
