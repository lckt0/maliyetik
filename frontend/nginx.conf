# Host adı `dev.` ile başlayan kopyalar (test ortamı) arama motorlarına kapatılır.
# Boş değerde nginx `add_header`'ı hiç eklemez.
map $host $robots_tag {
    default   "";
    "~^dev\." "noindex, nofollow, noarchive";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    client_max_body_size 60m;   # evrak yükleme (MAX_UPLOAD_MB ile uyumlu)

    # Yönlendirmeler göreceli (Location: /app/) üretilsin: TLS önde bir ters vekilde
    # sonlandırıldığında $scheme burada hep "http" olur ve mutlak yönlendirme yanlış
    # şemaya düşer.
    absolute_redirect off;

    # Sıkıştırma (nginx imajında varsayılan kapalı). gzip_static: yanında .gz varsa
    # hazır dosya gönderilir.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json application/wasm;

    # Güvenlik başlıkları — statik SPA + /api proxy tüm yanıtlarını kapsar
    # (backend'deki helmet() yalnızca kendi yanıtlarını kapsıyordu, bu üst katman tüm origin'i korur).
    # Kendi add_header'ı olan location'lar bu mirası kaybettiği için snippet'i ayrıca include eder.
    include /etc/nginx/snippets/security-headers.conf;

    # Docker embedded DNS — backend upstream'i istek anında çözülür,
    # böylece backend geç kalksa bile nginx başlangıçta patlamaz.
    resolver 127.0.0.11 valid=10s;

    # API → backend (dahili ağ). NestJS global prefix + versiyon: /api/v1/...
    location /api/ {
        set $upstream http://backend:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Evrak/avatar dosyaları → GCS (dahili). storage.googleapis.com hiçbir zaman tarayıcıya
    # sızmaz; backend imzalı URL'leri zaten bu domain altında (/files/...) üretir.
    # İmza `SignedHeaders=host` içerdiğinden Host üstbilgisi storage.googleapis.com olarak
    # zorlanır — aksi halde GCS imza doğrulaması reddeder.
    location /files/ {
        resolver 8.8.8.8 valid=300s;
        proxy_ssl_server_name on;
        proxy_set_header Host storage.googleapis.com;
        proxy_pass https://storage.googleapis.com/;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_pass_header ETag;
        proxy_pass_header Last-Modified;
        proxy_pass_header Content-Disposition;
    }

    # Dev'de robots.txt de kapalı sürümle değişir: X-Robots-Tag başlığı tüm yolları
    # kapsar, ama robots.txt'i ayrıca kapatmak taramanın hiç başlamamasını sağlar.
    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        if ($robots_tag != "") {
            return 200 "User-agent: *\nDisallow: /\n";
        }
    }

    # Service worker — /app/ PWA'sını kontrol eder. Asla cache'lenmemeli: eski bir sw.js
    # cache'ten servis edilirse kullanıcı yeni sürümü hiç alamaz ve uygulamada "kilitlenir".
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Masaüstü panelin service worker'ı — panelin "kurulabilir uygulama" olmasını
    # sağlar (bkz. src/utils/appWindow.ts). sw.js ile aynı gerekçe: asla cache'lenmez.
    location = /panel-sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Masaüstü uygulama manifest'i. `.webmanifest` nginx mime.types'ta YOK; tip
    # verilmezse application/octet-stream gider ve nosniff ile birlikte tarayıcı
    # manifest'i reddeder.
    location = /uygulama.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
    }

    # Mobil PWA — kendi index.html'i olan ikinci Vite girişi. Kök index.html SEO/OG
    # etiketleriyle dolu ve manifest oraya konsa masaüstü ziyaretçilere de kurulum
    # teklif edilirdi; ayrı giriş aynı zamanda mobil paketin landing/admin kodunu
    # hiç indirmemesini sağlar.
    location = /app { return 301 /app/; }

    # nginx'in mime.types dosyasında `.webmanifest` YOK → tip application/octet-stream
    # olarak gidiyor ve `X-Content-Type-Options: nosniff` ile birlikte tarayıcı manifest'i
    # reddediyor, uygulama kurulabilir olmaktan çıkıyordu. `types { }` bloğu üst seviyedeki
    # tüm eşlemeleri ezeceği için tip yalnızca bu konumda `default_type` ile veriliyor.
    location = /app/manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
    }

    # index.html ASLA uzun süre önbelleklenmemeli. Buna açık bir Cache-Control
    # verilmediğinde tarayıcı sezgisel önbellekleme uyguluyor (genelde Last-Modified'ın
    # yaşının %10'u kadar). Sonuç: yayından sonra kullanıcının sekmesi ESKİ index.html'i
    # tutuyor, o da artık silinmiş hash'li chunk dosyalarına atıf yapıyor; uygulama içinde
    # herhangi bir sayfaya geçiş dinamik import hatasıyla BOŞ EKRANA düşüyor, yalnızca
    # elle yenileme düzeltiyordu. `no-cache` dosyayı önbellekten çıkarmaz, her istekte
    # doğrulatır — değişmediyse 304 döner, maliyeti yok denecek kadar azdır.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /app/index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /app/ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /app/index.html;
    }

    # SPA fallback — tüm rotalar index.html'e
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik varlıklar için uzun cache (dosya adları içerik hash'i taşır).
    # Tek Cache-Control satırı: `expires` kendi başlığını yazdığı için add_header ile
    # birlikte kullanıldığında yanıtta İKİ Cache-Control satırı oluşuyordu.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }
}
